# Set update schedule for GitHub Actions

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    target-branch: "develop"

  - package-ecosystem: pip
    directory: /src/https
    schedule:
      interval: daily

  - package-ecosystem: bundler
    directory: /tests
    schedule:
      interval: daily
